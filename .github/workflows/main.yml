name: OSSMeet TryCloudflare Demo

on:
  workflow_dispatch:

jobs:
  run-ossmeet:
    runs-on: ubuntu-latest
    timeout-minutes: 365

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Start OSSMeet
        shell: bash
        run: |
          nohup pnpm dev --host 0.0.0.0 > ossmeet.log 2>&1 &
          echo $! > ossmeet.pid

          for i in {1..60}; do
            if curl -fsS http://127.0.0.1:3000 > /dev/null; then
              echo "OSSMeet is running"
              exit 0
            fi

            echo "Waiting for OSSMeet..."
            sleep 2
          done

          echo "OSSMeet failed to start"
          cat ossmeet.log
          exit 1

      - name: Install Cloudflared
        shell: bash
        run: |
          curl -L \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

      - name: Start TryCloudflare tunnel
        shell: bash
        run: |
          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:3000 \
            2>&1 | tee cloudflared.log
