name: OSSMeet TryCloudflare Demo

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run-ossmeet:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Create local OSSMeet configuration
        shell: bash
        run: |
          cp apps/web/.dev.vars.example apps/web/.dev.vars
          cp apps/web/wrangler.jsonc.example apps/web/wrangler.jsonc

          python3 - <<'PY'
          from pathlib import Path

          path = Path("apps/web/.dev.vars")
          values = {
              "APP_URL": "http://127.0.0.1:3000",
              "ENVIRONMENT": "development",
              "AUTH_SECRET": "github-actions-ossmeet-demo-secret-change-me",
          }

          lines = path.read_text().splitlines()
          found = set()

          for i, line in enumerate(lines):
              key = line.split("=", 1)[0].strip()
              if key in values:
                  lines[i] = f"{key}={values[key]}"
                  found.add(key)

          for key, value in values.items():
              if key not in found:
                  lines.append(f"{key}={value}")

          path.write_text("\n".join(lines) + "\n")
          PY

      - name: Start OSSMeet
        shell: bash
        run: |
          set -u

          nohup pnpm --filter @ossmeet/web dev \
            --host 0.0.0.0 \
            --port 3000 \
            > ossmeet.log 2>&1 &

          echo $! > ossmeet.pid

          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:3000 >/dev/null; then
              echo "OSSMeet is running on port 3000"
              break
            fi

            if ! kill -0 "$(cat ossmeet.pid)" 2>/dev/null; then
              echo "OSSMeet stopped during startup"
              cat ossmeet.log
              exit 1
            fi

            sleep 2
          done

          if ! curl -fsS http://127.0.0.1:3000 >/dev/null; then
            echo "OSSMeet did not start"
            cat ossmeet.log
            exit 1
          fi

      - name: Install cloudflared
        shell: bash
        run: |
          curl -fL \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64.deb \
            -o cloudflared.deb

          sudo dpkg -i cloudflared.deb

      - name: Start TryCloudflare tunnel
        shell: bash
        run: |
          cloudflared tunnel \
            --no-autoupdate \
            --url http://127.0.0.1:3000 \
            2>&1 | tee cloudflared.log
